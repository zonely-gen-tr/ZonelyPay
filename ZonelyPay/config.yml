site:
  name: "Örnek Firma"  # Firma adı
  base_url: "https://pays.zonely.gen.tr" # Kurulum yapılan sağlayıcı site adresi.
  logo_url: "https://provider.example.com/assets/logo.png" # Logonuz.
  sales_contract_url: "https://pays.zonely.gen.tr/contract.html" # Sözleşme yolu.
  notify_path: "/Files/Api/process.php?api=zonelypay" # X sitedeki callback yolu (düzenlemeyin.)
  merchant_email: "merchant@example.com" # Firma bilgilendirme e-postası

security:
  shared_secret: "06HyGJkyUgWwv7vIoK73AKoMLohLkOKK5sZWIr72AHX4rEXm4CXTa8vAZ4L5FXTK"  # (düzenlemeyin.)
  allow_origins: ["*"] # CORS serbest bırakılır.
